name: TAVANA Studio Android Build (APK & AAB)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (all, debug, release)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - debug
          - release
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build APK and AAB for GitHub
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Djava.awt.headless=true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Ensure Keystore Exists
        run: |
          echo "=== Setting up Android signing keystore ==="
          if [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating fresh standard debug.keystore..."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -f debug.keystore && ls -lh debug.keystore

      - name: Configure Environment (.env)
        env:
          AI_GATEWAY_URL: ${{ secrets.AI_GATEWAY_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "=== Configuring Android Environment (100% Autonomous) ==="
          echo "GEMINI_API_KEY=${GEMINI_API_KEY:-}" > .env
          echo "AI_GATEWAY_URL=${AI_GATEWAY_URL:-https://gateway.tavana.studio/api/v1/ai}" >> .env
          echo "AI_GATEWAY_ENV=production" >> .env
          echo "=== Environment configured successfully ==="

      - name: Run Unit Tests (Optional)
        continue-on-error: true
        run: |
          echo "=== Running Tests (Non-blocking) ==="
          ./gradlew :app:testDebugUnitTest -Djava.awt.headless=true --no-daemon --no-configuration-cache || echo "Unit tests skipped or reported warnings. Proceeding with binary packaging..."

      - name: Build Debug APK & AAB
        run: |
          echo "=== Building Debug Binaries (APK & AAB) ==="
          ./gradlew :app:assembleDebug :app:bundleDebug -Djava.awt.headless=true --no-daemon --no-configuration-cache

      - name: Build Release APK & AAB
        run: |
          echo "=== Building Release Binaries (APK & AAB) ==="
          ./gradlew :app:assembleRelease :app:bundleRelease -Djava.awt.headless=true --no-daemon --no-configuration-cache

      - name: Export and Collect Artifacts
        run: |
          echo "=== Exporting Artifacts to build-artifacts directory ==="
          ./gradlew :app:exportArtifacts -Djava.awt.headless=true --no-daemon --no-configuration-cache || true
          mkdir -p build-artifacts
          # Ensure files are copied if not already
          cp -u app/build/outputs/apk/debug/*.apk build-artifacts/TAVANA-Studio-debug.apk || true
          cp -u app/build/outputs/apk/release/*.apk build-artifacts/TAVANA-Studio-release.apk || true
          cp -u app/build/outputs/bundle/debug/*.aab build-artifacts/TAVANA-Studio-debug.aab || true
          cp -u app/build/outputs/bundle/release/*.aab build-artifacts/TAVANA-Studio-release.aab || true
          echo "=== Generated Build Artifacts ==="
          ls -lh build-artifacts/

      - name: Upload All Build Artifacts (APK & AAB)
        uses: actions/upload-artifact@v4
        with:
          name: TAVANA-Studio-All-Binaries
          path: build-artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TAVANA-Studio-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Debug AAB (Google Play Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: TAVANA-Studio-debug-AAB
          path: app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: TAVANA-Studio-release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: TAVANA-Studio-release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build-artifacts/TAVANA-Studio-release.apk
            build-artifacts/TAVANA-Studio-release.aab
            build-artifacts/TAVANA-Studio-debug.apk
            build-artifacts/TAVANA-Studio-debug.aab
          draft: false
          prerelease: false
          generate_release_notes: true
